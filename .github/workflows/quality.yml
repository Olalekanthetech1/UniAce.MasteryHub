name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        id: install_deps
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: TypeScript validation
        if: ${{ always() && steps.install_deps.outcome == 'success' }}
        run: bun run lint

      - name: Production build
        if: ${{ always() && steps.install_deps.outcome == 'success' }}
        run: bun run build
